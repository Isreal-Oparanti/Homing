# Optional local Postgres with pgvector, for anyone with Docker.
# Without Docker, point DATABASE_URL at a Supabase dev database instead.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: homing
      POSTGRES_PASSWORD: homing
      POSTGRES_DB: homing
    ports:
      - "5432:5432"
    volumes:
      - homing-db:/var/lib/postgresql/data
volumes:
  homing-db:
