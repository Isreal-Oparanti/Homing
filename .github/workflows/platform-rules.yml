# ADR 0008: platform rules are architecture constraints. No video or audio downloaders
# (yt-dlp and the like) may enter the dependency lock files; YouTube captions come only
# from youtube-transcript-api, behind FEATURE_YT_CAPTIONS.
name: Platform rules

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-downloaders:
    name: No video downloaders in lock files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check server/uv.lock and web/package-lock.json
        run: |
          python_banned='^name = "(yt-dlp|yt-dlp-ejs|youtube-dl|instaloader|pytube|pytubefix|gallery-dl|snscrape|you-get|streamlink)"$'
          node_banned='"node_modules/(@[^/]+/)?(ytdl-core|youtube-dl-exec|yt-dlp-exec|yt-dlp-wrap|ytdlp-nodejs|instagram-scraper)"'
          found=0
          if grep -n -E "$python_banned" server/uv.lock; then found=1; fi
          if grep -n -E "$node_banned" web/package-lock.json; then found=1; fi
          if [ "$found" = 1 ]; then
            echo "::error::A video or audio downloader is in a lock file. ADR 0008 forbids them."
            exit 1
          fi
          echo "No downloaders found."
