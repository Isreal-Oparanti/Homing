[project]
name = "homing-server"
version = "0.1.0"
description = "Homing API and worker: save anything to use now or later."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "av>=19.0.2",
    "dateparser>=1.4.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.41.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2",
    "trafilatura>=2.3.1",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"app/scripts/*" = ["E501"]
